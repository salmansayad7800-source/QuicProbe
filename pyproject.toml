[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quicprobe"
version = "0.1.0"
description = "QuicProbe - a Pure Python QUIC/HTTP3 and security log analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "QuicProbe Contributors" }
]
keywords = ["cybersecurity", "quic", "http3", "security", "python"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: System :: Networking",
]

[project.scripts]
quicprobe = "quicprobe.cli:main"

[tool.setuptools]
packages = ["quicprobe", "quicprobe.core"]
